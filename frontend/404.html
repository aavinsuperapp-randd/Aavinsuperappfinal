<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — Aavin R&D System</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .not-found-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .not-found-card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      box-shadow: var(--shadow-md);
    }
    .not-found-badge {
      display: inline-block;
      padding: 4px 14px;
      background: var(--amber-50);
      color: var(--amber-600);
      border: 1px solid #fde68a;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .not-found-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 8px;
    }
    .not-found-desc {
      font-size: 0.88rem;
      color: var(--gray-500);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .not-found-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="top-nav">
      <div class="top-nav-inner">
        <div class="nav-brand">
          <img src="/assets/aavin-logo.png" alt="Aavin Logo" onerror="this.src='/assests/aavin-logo.png'">
          <span>AAVIN R&D System</span>
        </div>
      </div>
    </header>

    <main class="page-body not-found-wrapper">
      <div class="not-found-card">
        <div class="not-found-badge">404 Error</div>
        <h1 class="not-found-title">Page Not Found</h1>
        <p class="not-found-desc">
          The requested page or resource could not be found. It may have been moved, renamed, or is temporarily unavailable.
        </p>
        <div class="not-found-actions">
          <a href="/login.html" class="btn btn-primary">Go to Login</a>
          <a href="/" class="btn btn-outline">Go to Home</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      &copy; 2026 Aavin Milk Federation & Research & Development Division. All rights reserved.
    </footer>
  </div>
</body>
</html>
