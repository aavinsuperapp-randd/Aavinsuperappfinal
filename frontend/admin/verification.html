<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Approvals — AAVIN BMC</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Ambient Background Canvas -->
  <div class="bg-ambient-canvas">
    <div class="blob blob-blue-1"></div>
    <div class="blob blob-green-1"></div>
  </div>

  <div class="admin-shell">
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-logo">
        <img src="/assets/aavin-logo.png" alt="AAVIN Logo">
        <span>AAVIN Admin</span>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-item">
          <span>📊</span> Dashboard Home
        </a>
        <a href="verification.html" class="admin-nav-item active">
          <span>📋</span> Users & Approvals
        </a>
        <a href="trips.html" class="admin-nav-item">
          <span>🚚</span> Trips Management
        </a>
        <a href="bmc.html" class="admin-nav-item">
          <span>🏭</span> BMC Management
        </a>
        <a href="executive-officers.html" class="admin-nav-item">
          <span>👔</span> Executive Officers
        </a>
        <button id="logout-btn" class="admin-nav-item logout-btn" style="margin-top:auto; margin-bottom:16px;">
          <span>🚪</span> Logout
        </button>
      </nav>
    </aside>

    <!-- Main Content Panel -->
    <div class="admin-main">
      <header class="admin-header">
        <button id="sidebar-toggle-btn" class="sidebar-toggle">☰</button>
        <div class="admin-header-title">Grievance & Profile Audits</div>
        <div class="admin-user-profile">
          <div class="admin-user-name">Administrator</div>
        </div>
      </header>

      <main class="admin-content">
        <!-- Hidden by default, unhidden after successful authorization check -->
        <div id="main-admin-content" class="hidden">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h2 style="font-size: 1.3rem; margin:0; font-weight:700;">User Accounts & Approvals</h2>
              <p class="text-muted text-sm" style="margin-top:2px;">Review credentials and approve pending users.</p>
            </div>
          </div>

          <!-- Filter Tabs -->
          <div class="d-flex gap-2 mb-3" style="gap:8px;">
            <button id="user-tab-pending" class="btn btn-primary btn-sm user-tab-btn active">Pending Approvals</button>
            <button id="user-tab-all" class="btn btn-outline btn-sm user-tab-btn">All Registered Users</button>
            <button id="user-tab-approved" class="btn btn-outline btn-sm user-tab-btn">Approved Users</button>
          </div>

          <!-- Approvals / Users Table -->
          <div class="verification-card mt-2">
            <div class="table-responsive">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>User Profile</th>
                    <th>Role</th>
                    <th>Date of Birth</th>
                    <th>Registered On</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="pending-list-container">
                  <!-- Dynamically loaded by admin.js -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
