<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AAVIN BMC</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <img src="/assets/aavin-logo.png" alt="AAVIN Logo">
        <span>AAVIN BMC</span>
      </a>
      
      <h1 class="auth-title">Sign In</h1>
      <p class="auth-subtitle">Access your monitoring dashboard</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" class="form-input" id="login-email" placeholder="name@aavin.in" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" class="form-input" id="login-password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-2">Login</button>
      </form>

      <div class="auth-divider"></div>

      <div class="auth-footer">
        Need an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <script src="/js/supabase.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
