<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaints & Issues — P&I AGM Portal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/pi-agm-portal.css">
  <link rel="stylesheet" href="../css/pi-agm-portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-shell">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar" id="pi-agm-sidebar">
      <div class="admin-sidebar-logo">
        <img src="/assets/aavin-logo.png" alt="AAVIN Logo">
        <span>P&amp;I AGM Portal</span>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-item"><span>🏠</span> Executive Overview</a>
        
        <a href="issues.html" class="admin-nav-item active"><span>⚠️</span> Complaints</a>
        <a href="fleet.html" class="admin-nav-item"><span>👥</span> Fleet & Staff</a>
        <a href="bmcs.html" class="admin-nav-item"><span>🏭</span> BMC Management</a>
        <a href="analysis.html" class="admin-nav-item"><span>📈</span> Deep Analysis</a>
        <button id="logout-btn" class="admin-nav-item logout-btn" style="margin-top:auto; margin-bottom:16px;"><span>🚪</span> Logout</button>
      </nav>
    </aside>

    <div class="admin-main">
      <header class="admin-header">
        <div class="header-left">
          <button id="sidebar-toggle-btn" class="sidebar-toggle">☰</button>
          <div class="header-greeting">
            <h2>BMC Issues & Operational Complaints</h2>
            <p>Track, filter, and mark operational issues resolved.</p>
          </div>
        </div>
        <div class="header-right"><div class="header-user"><div class="header-avatar">GM</div><div class="header-user-info"><div class="header-user-name" id="header-pi-agm-name">Manager</div><div class="header-user-role">Executive Command</div></div></div></div>
      </header>

      <main class="admin-content">
        <div id="main-pi-agm-content" class="hidden">

          <!-- Filter Bar -->
          <div class="filter-bar">
            <div class="filter-group">
              <span class="filter-label">BMC:</span>
              <select id="bmc-filter-select" class="form-control form-control-sm" style="width:180px;">
                <option value="">All BMC Units</option>
              </select>
              <span class="filter-label" style="margin-left:6px;">Status:</span>
              <select id="status-filter-select" class="form-control form-control-sm" style="width:120px;">
                <option value="all">All</option>
                <option value="pending" selected>Pending</option>
                <option value="completed">Resolved</option>
              </select>
              <span class="filter-label" style="margin-left:6px;">Severity:</span>
              <select id="severity-filter-select" class="form-control form-control-sm" style="width:120px;">
                <option value="">All</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </div>
            <div class="filter-group">
              <input type="text" id="search-issue-input" class="form-control form-control-sm" placeholder="🔍 Search description..." style="width:180px;">
              <button id="refresh-issues-btn" class="btn btn-outline btn-sm">🔄 Refresh</button>
            </div>
          </div>

          <!-- Issues Grid -->
          <div id="issues-container" class="items-grid"></div>

        </div>
      </main>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/pi-agm-api.js"></script>
  <script src="../js/pi-agm-issues.js"></script>
</body>
</html>
