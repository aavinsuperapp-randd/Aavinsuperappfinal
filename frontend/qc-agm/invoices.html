<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices — QC AGM Desk | AAVIN</title>
  <meta name="description" content="QC AGM Portal — BMC Visit Invoices, Tanker Milk Despatch Advice">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/worker.css">
  <link rel="stylesheet" href="../css/qc.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    .invoices-filter-card {
      background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px;
      padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 20px;
    }
    .invoices-filter-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .btn-date-filter {
      padding: 7px 16px; font-weight: 700; font-size: 0.82rem; border-radius: 8px;
      cursor: pointer; transition: all 0.2s ease; border: 1px solid #CBD5E1;
      background: #F1F5F9; color: #475569;
    }
    .btn-date-filter:hover { background: #E2E8F0; color: #1E293B; }
    .btn-date-filter.active {
      background: #0D9488; color: #FFFFFF; border-color: #0F766E;
      box-shadow: 0 2px 6px rgba(13,148,136,0.3);
    }
    .invoice-date-input {
      padding: 6px 12px; border-radius: 8px; font-weight: 600; font-family: Outfit, sans-serif;
      background: #FFFFFF; border: 1.5px solid #CBD5E1; font-size: 0.88rem; outline: none;
      color: #0F172A; transition: border 0.15s;
    }
    .invoice-date-input:focus { border-color: #0D9488; }
    .btn-reset-filter {
      padding: 9px 14px; border: 1.5px solid #CBD5E1; background: #F8FAFC; color: #475569;
      border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.15s;
    }
    .btn-reset-filter:hover { background: #E2E8F0; color: #0F172A; }
    .invoices-search-bar {
      display: flex; gap: 10px; align-items: center; margin-bottom: 0;
    }
    .invoices-search-bar input {
      flex: 1; padding: 9px 14px; border: 1.5px solid #CBD5E1; border-radius: 8px;
      font-size: 0.88rem; font-family: Outfit, sans-serif; outline: none;
      transition: border 0.15s;
    }
    .invoices-search-bar input:focus { border-color: #0D9488; }
    .invoices-search-bar button.btn-search {
      padding: 9px 18px; border: none; border-radius: 8px;
      background: linear-gradient(135deg, #0D9488, #0F766E); color: #fff;
      font-weight: 700; font-size: 0.85rem; cursor: pointer;
      transition: opacity 0.15s;
    }
    .invoices-search-bar button.btn-search:hover { opacity: 0.88; }
    .invoice-table {
      width: 100%; border-collapse: collapse; font-size: 0.85rem;
    }
    .invoice-table thead th {
      background: #F1F5F9; padding: 10px 14px; text-align: left;
      font-weight: 700; color: #334155; border-bottom: 2px solid #E2E8F0;
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .invoice-table tbody td {
      padding: 10px 14px; border-bottom: 1px solid #F1F5F9; color: #0F172A;
    }
    .invoice-table tbody tr:hover {
      background: #F8FAFC;
    }
    .btn-invoice-pdf {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 12px; border: 1.5px solid #DC2626; border-radius: 8px;
      background: #FFF; color: #DC2626; font-weight: 700; font-size: 0.78rem;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-invoice-pdf:hover {
      background: #DC2626; color: #FFF;
    }
    .invoice-empty {
      text-align: center; padding: 48px 20px; color: #94A3B8;
      font-size: 0.95rem;
    }
    .invoice-count-badge {
      background: #CCFBF1; color: #0F766E; border-radius: 20px;
      padding: 2px 10px; font-size: 0.78rem; font-weight: 700;
      margin-left: 8px;
    }

    /* Invoice Preview Modal */
    .inv-modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.55);
      z-index: 9000; display: flex; align-items: center; justify-content: center;
    }
    .inv-modal-overlay.hidden { display: none; }
    .inv-modal {
      background: #fff; border-radius: 16px; width: 720px; max-width: 95vw;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.22);
    }
    .inv-modal-header {
      padding: 20px 24px 16px; border-bottom: 1px solid #E2E8F0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .inv-modal-header h3 { margin: 0; font-size: 1rem; font-weight: 800; color: #0F172A; }
    .inv-modal-body { padding: 20px 24px; }
    .inv-detail-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;
    }
    .inv-detail-item {
      background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px;
      padding: 10px 14px;
    }
    .inv-detail-item .lbl { font-size: 0.75rem; color: #64748B; font-weight: 700; text-transform: uppercase; }
    .inv-detail-item .val { font-size: 0.95rem; color: #0F172A; font-weight: 600; margin-top: 2px; }
    .inv-modal-footer {
      padding: 16px 24px; border-top: 1px solid #E2E8F0;
      display: flex; gap: 10px; justify-content: flex-end;
    }
  </style>
</head>
<body>

  <div class="qc-shell">
    <div id="qc-agm-sidebar-overlay" class="qc-sidebar-overlay"></div>

    <!-- QC AGM Sidebar -->
    <aside class="qc-sidebar" id="qc-agm-sidebar">
      <div class="qs-logo">
        <div class="qs-logo-inner">
          <img src="/assets/aavin-logo.png" alt="AAVIN">
          <div>
            <span>QC AGM Desk</span>
            <div class="qs-logo-badge" style="background:#0D9488;">QUALITY CONTROL</div>
          </div>
        </div>
      </div>

      <nav class="qs-nav">
        <a href="dashboard.html" class="qs-nav-item">
          <span>📊</span> Dashboard Overview
        </a>
        <a href="invoices.html" class="qs-nav-item active">
          <span>🧾</span> Invoices
        </a>
        <a href="excel-import.html" class="qs-nav-item">
          <span>📥</span> Excel Import
        </a>
        <a href="profile.html" class="qs-nav-item">
          <span>👤</span> My Profile
        </a>
        <button id="logout-btn" class="qs-nav-item logout-btn" style="margin-top: 4px; color: #FCA5A5;">
          <span>🚪</span> Logout
        </button>
      </nav>
    </aside>

    <!-- Main Content Panel -->
    <div class="qc-main">
      <header class="qc-header">
        <div class="qc-header-left">
          <button id="qc-agm-toggle-btn" class="qc-mobile-btn" aria-label="Toggle Navigation Menu" title="Toggle Navigation Menu">⋮</button>
          <div class="qc-header-title">QC AGM</div>
        </div>
        <div class="qc-header-right">
          <div>User: <strong id="header-agm-name">Loading...</strong></div>
        </div>
      </header>

      <main class="qc-content">
        <!-- Modern Responsive Filter Card -->
        <div class="invoices-filter-card">
          <!-- Row 1: Quick Date Filter Buttons & Date Picker -->
          <div class="invoices-filter-row">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              <span style="font-weight:700; color:#334155; font-size:0.85rem;">Date Filter:</span>
              <button type="button" id="btn-date-today" class="btn-date-filter active">Today</button>
              <button type="button" id="btn-date-yesterday" class="btn-date-filter">Yesterday</button>
              <button type="button" id="btn-date-all" class="btn-date-filter">All Invoices</button>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-weight:700; color:#334155; font-size:0.85rem; white-space:nowrap;">Select Date:</span>
              <input type="date" id="invoice-date-picker" class="invoice-date-input">
            </div>
          </div>

          <!-- Row 2: Search Bar & Clear -->
          <div class="invoices-search-bar">
            <input type="text" id="invoice-search-input" placeholder="Search by BMC Code, BMC Name, or Serial Number...">
            <button id="invoice-search-btn" class="btn-search">🔍 Search</button>
            <button id="invoice-reset-btn" class="btn-reset-filter" title="Reset all filters">✕ Clear</button>
          </div>
        </div>

        <div class="content-card" style="background:#FFFFFF; border:1px solid #E2E8F0; border-radius:14px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.04);">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <h3 style="margin:0;font-size:1.05rem;font-weight:800;color:#0F172A;">
              Tanker Milk Despatch Advice Records
              <span class="invoice-count-badge" id="invoice-count-badge">0</span>
            </h3>
            <div id="invoice-filter-status" style="font-size:0.82rem; font-weight:600; color:#64748B;">Showing: Today's Invoices</div>
          </div>

          <div class="table-responsive">
            <table class="invoice-table">
              <thead>
                <tr>
                  <th style="width:70px;text-align:center;">S.No</th>
                  <th>BMC Code</th>
                  <th>BMC Name</th>
                  <th>Date</th>
                  <th style="text-align:right;">Action</th>
                </tr>
              </thead>
              <tbody id="invoices-table-body">
                <tr><td colspan="5" class="invoice-empty">Loading invoices...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Invoice Preview Modal -->
  <div id="invoice-preview-modal" class="inv-modal-overlay hidden">
    <div class="inv-modal">
      <div class="inv-modal-header">
        <h3 id="inv-modal-title">🧾 Invoice Preview</h3>
        <button id="inv-modal-close" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:#94A3B8;padding:4px 8px;border-radius:6px;">✕</button>
      </div>
      <div class="inv-modal-body" id="inv-modal-body">
        <!-- Populated by JS -->
      </div>
      <div class="inv-modal-footer">
        <button class="btn btn-outline" id="inv-modal-dismiss">Close</button>
        <button class="btn-invoice-pdf" id="inv-modal-download" style="padding:8px 18px;font-size:0.88rem;">📄 Download PDF</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/qc-agm-api.js"></script>
  <script src="../js/shared-invoice.js"></script>
  <script src="../js/qc-agm-invoices.js"></script>
</body>
</html>
