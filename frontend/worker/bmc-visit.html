<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMC Visit &amp; Testing — Field Worker Portal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/gm-portal.css">
  <link rel="stylesheet" href="../css/gm-portal.css">
  <link rel="stylesheet" href="../css/global.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-shell">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar" id="worker-sidebar">
      <div class="admin-sidebar-logo">
        <img src="/assets/aavin-logo.png" alt="AAVIN Logo">
        <span>Field Worker</span>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-item"><span>📋</span> Duty</a>
        <a href="analysis.html" class="admin-nav-item"><span>📈</span> Analysis</a>
        <button id="logout-btn" class="admin-nav-item logout-btn" style="margin-top:auto; margin-bottom:16px;"><span>🚪</span> Logout</button>
      </nav>
    </aside>

    <div class="admin-main">
      <!-- Header -->
      <header class="admin-header">
        <div class="header-left">
          <button id="sidebar-toggle-btn" class="sidebar-toggle">☰</button>
          <div class="header-greeting">
            <h2>BMC Operations &amp; Quality Testing</h2>
            <p>Field Worker Portal — Active Trip Visit</p>
          </div>
        </div>
        <div class="header-right">
          <button type="button" class="btn btn-outline" id="btn-header-back" onclick="handleCloseBmcVisit()" style="font-weight:700; font-size:0.85rem;">
            ⬅️ Close BMC Visit / Back
          </button>
        </div>
      </header>

      <main class="admin-content">
        <div id="main-bmc-visit-content" style="max-width: 900px; margin: 0 auto;">

          <!-- TOP BMC DETAILS CARD -->
          <div class="content-card mb-4" style="border: 2px solid #2563EB; background: #F8FAFC; border-radius: 16px; padding: 22px;">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px;">
              <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <span class="badge badge-blue" id="bv-seq-badge" style="font-size: 0.85rem; padding: 6px 14px;">BMC #1</span>
                <span class="badge badge-warning" id="bv-status-badge" style="font-size: 0.85rem; padding: 6px 14px;">Pending</span>
              </div>
              <button type="button" class="btn btn-outline" onclick="handleCloseBmcVisit()" style="padding: 6px 16px; font-weight: 700; font-size: 0.85rem;">
                🔒 Close BMC Visit / Back
              </button>
            </div>

            <h2 id="bv-bmc-name" style="margin: 0 0 6px 0; font-size: 1.5rem; font-weight: 800; color: #0F172A;">Loading BMC Details...</h2>
            <div id="bv-bmc-sub" style="font-size: 0.9rem; color: #64748B; font-weight: 500;">
              Fetching location &amp; route metadata...
            </div>
          </div>

          <!-- 1. WEIGHT SECTION -->
          <div class="content-card mb-4" style="border: 1px solid #E2E8F0; border-radius: 14px; padding: 20px;">
            <h3 style="margin: 0 0 16px 0; font-size: 1.1rem; font-weight: 800; color: #0F172A; display: flex; align-items: center; gap: 10px;">
              <span>⚖️</span> 1. WEIGHT
            </h3>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" style="font-size: 0.85rem; font-weight: 700; color: #334155;">Compartment</label>
                <select id="bv-compartment" class="form-control">
                  <option value="Front">Front</option>
                  <option value="Mid">Mid</option>
                  <option value="Rear">Rear</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" style="font-size: 0.85rem; font-weight: 700; color: #334155;">Milk Weight (KG)</label>
                <input type="number" step="0.1" id="bv-weight-kg" class="form-control" placeholder="e.g. 2500.5" min="0" max="100000">
              </div>
            </div>
            <div style="text-align: right; margin-top: 16px;">
              <button type="button" class="btn btn-primary" id="bv-btn-save-weight" style="padding: 8px 22px; font-weight: 700; font-size: 0.88rem;">
                💾 SAVE WEIGHT
              </button>
            </div>
          </div>

          <!-- 2. FTIR TEST SECTION -->
          <div class="content-card mb-4" style="border: 1px solid #E2E8F0; border-radius: 14px; padding: 20px;">
            <h3 style="margin: 0 0 16px 0; font-size: 1.1rem; font-weight: 800; color: #0F172A; display: flex; align-items: center; gap: 10px;">
              <span>🧪</span> 2. FTIR TEST
            </h3>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" style="font-size: 0.85rem; font-weight: 700; color: #334155;">FAT (%)</label>
                <input type="number" step="0.01" id="bv-ftir-fat" class="form-control" placeholder="e.g. 4.2" min="0" max="100">
              </div>
              <div class="col-md-6">
                <label class="form-label" style="font-size: 0.85rem; font-weight: 700; color: #334155;">SNF (%)</label>
                <input type="number" step="0.01" id="bv-ftir-snf" class="form-control" placeholder="e.g. 8.5" min="0" max="100">
              </div>
            </div>
            <div style="text-align: right; margin-top: 16px;">
              <button type="button" class="btn btn-primary" id="bv-btn-save-ftir" style="padding: 8px 22px; font-weight: 700; font-size: 0.88rem;">
                💾 SAVE FTIR TEST
              </button>
            </div>
          </div>

          <!-- 3. GERBER & ADDITIONAL QUALITY TESTS SECTION -->
          <div class="content-card mb-4" style="border: 1px solid #E2E8F0; border-radius: 14px; padding: 20px;">
            <h3 style="margin: 0 0 16px 0; font-size: 1.1rem; font-weight: 800; color: #0F172A; display: flex; align-items: center; gap: 10px;">
              <span>🔬</span> 3. GERBER &amp; QUALITY TESTS
            </h3>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label" style="font-size: 0.85rem; font-weight: 700; color: #334155;">FAT (%)</label>
                <input type="number" step="0.01" id="bv-gerber-fat" class="form-control" placeholder="e.g. 4.2" min="0" max="100">
              </div>
              <div class="col-md-4">
                <label class="form-label" style="font-size: 0.85rem; font-weight: 700; color: #334155;">SNF (%)</label>
                <input type="number" step="0.01" id="bv-gerber-snf" class="form-control" placeholder="e.g. 8.5" min="0" max="100">
              </div>
              <div class="col-md-4">
                <label class="form-label" style="font-size: 0.85rem; font-weight: 700; color: #334155;">Lactometer (LACTO)</label>
                <input type="number" step="0.1" id="bv-gerber-lacto" class="form-control" placeholder="e.g. 28.5" min="0" max="100">
              </div>
            </div>
            <div class="row g-3 mt-1">
              <div class="col-md-6">
                <label class="form-label" style="font-size: 0.85rem; font-weight: 700; color: #334155;">MBRT / MPRT Test (hrs / result)</label>
                <input type="text" id="bv-gerber-mbrt" class="form-control" placeholder="e.g. 4.5 hrs or Pass" maxlength="50">
              </div>
              <div class="col-md-6">
                <label class="form-label" style="font-size: 0.85rem; font-weight: 700; color: #334155;">Acidity Test (%)</label>
                <input type="number" step="0.01" id="bv-gerber-acidity" class="form-control" placeholder="e.g. 0.14" min="0" max="10">
              </div>
            </div>
            <div style="text-align: right; margin-top: 16px;">
              <button type="button" class="btn btn-primary" id="bv-btn-save-gerber" style="padding: 8px 22px; font-weight: 700; font-size: 0.88rem;">
                💾 SAVE QUALITY TESTS
              </button>
            </div>
          </div>

          <!-- 4. REPORT SECTION -->
          <div class="content-card mb-4" style="border: 1px solid #E2E8F0; border-radius: 14px; padding: 20px;">
            <h3 style="margin: 0 0 16px 0; font-size: 1.1rem; font-weight: 800; color: #0F172A; display: flex; align-items: center; gap: 10px;">
              <span>📝</span> 4. REPORT
            </h3>
            <div class="mb-3">
              <label class="form-label" style="font-size: 0.85rem; font-weight: 700; color: #334155;">Report / Remarks</label>
              <textarea id="bv-report-text" class="form-control" rows="3" placeholder="Enter report or observations..." maxlength="1000"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label" style="font-size: 0.85rem; font-weight: 700; color: #334155;">Priority (Optional)</label>
              <select id="bv-report-priority" class="form-control">
                <option value="">Select Priority (Optional)</option>
                <option value="Low">Low</option>
                <option value="Mid">Mid</option>
                <option value="High">High</option>
              </select>
            </div>
            <div style="text-align: right; margin-top: 16px;">
              <button type="button" class="btn btn-primary" id="bv-btn-save-report" style="padding: 8px 22px; font-weight: 700; font-size: 0.88rem;">
                💾 SAVE REPORT
              </button>
            </div>
          </div>


          <!-- BOTTOM ACTION BAR -->
          <div class="content-card mb-5 text-center" style="background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 14px; padding: 20px;">
            <button type="button" class="btn btn-outline" onclick="handleCloseBmcVisit()" style="padding: 10px 30px; font-weight: 800; font-size: 0.95rem; min-width: 220px;">
              🔒 Close BMC Visit / Back
            </button>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/worker-api.js"></script>
  <script src="../js/worker-bmc-visit.js"></script>
</body>
</html>
