<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — AAVIN BMC Worker</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/worker.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="worker-shell">
    <!-- Sidebar -->
    <aside class="worker-sidebar">
      <div class="ws-logo">
        <div style="display:flex;align-items:center;gap:10px;">
          <img src="/assets/aavin-logo.png" alt="AAVIN Logo">
          <span>Worker Portal</span>
        </div>
        <button id="mobile-menu-toggle" class="mobile-menu-btn">☰</button>
      </div>

      <nav id="ws-nav" class="ws-nav">
        <a href="dashboard.html" class="ws-nav-item">
          <span>📊</span> Dashboard
        </a>
        <a href="trip-create.html" class="ws-nav-item">
          <span>🚚</span> Start New Trip
        </a>
        <a href="history.html" class="ws-nav-item">
          <span>📜</span> Trip History
        </a>
        <a href="analysis.html" class="ws-nav-item">
          <span>📈</span> Performance Analysis
        </a>
        <a href="profile.html" class="ws-nav-item active">
          <span>👤</span> My Profile
        </a>

        <div class="ws-nav-divider"></div>
        <button id="logout-btn" class="ws-nav-item" style="color:#fca5a5;">
          <span>🚪</span> Logout
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <div class="worker-main">
      <header class="worker-header">
        <div class="worker-header-title">Worker Profile Account</div>
        <div class="worker-header-user">
          Logged in as: <strong id="header-worker-name">Loading...</strong>
        </div>
      </header>

      <main class="worker-content">
        <div id="main-content-area" class="hidden" style="max-width: 600px;">

          <div class="page-top">
            <h1>My Profile Details</h1>
            <p>Your authenticated R&D / Field Worker account profile.</p>
          </div>

          <div class="form-section">
            <div class="form-section-title">
              <span>👤</span> Account Details
            </div>

            <div class="form-group mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" id="prof-name" class="form-input" readonly style="background:var(--gray-100);">
            </div>

            <div class="form-group mb-3">
              <label class="form-label">Email Address</label>
              <input type="text" id="prof-email" class="form-input" readonly style="background:var(--gray-100);">
            </div>

            <div class="form-row mb-3">
              <div class="form-group">
                <label class="form-label">Date of Birth</label>
                <input type="text" id="prof-dob" class="form-input" readonly style="background:var(--gray-100);">
              </div>

              <div class="form-group">
                <label class="form-label">Assigned System Role</label>
                <input type="text" id="prof-role" class="form-input" readonly style="background:var(--gray-100);">
              </div>
            </div>

            <div class="form-group mb-4">
              <label class="form-label">Account Verification Status</label>
              <div>
                <span id="prof-status-badge" class="status-pill pill-completed">Approved</span>
              </div>
            </div>

            <div class="d-flex justify-content-end">
              <button id="profile-logout-btn" class="btn btn-outline">
                Logout of Account
              </button>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/worker-api.js"></script>
  <script src="../js/worker-profile.js"></script>
</body>
</html>
